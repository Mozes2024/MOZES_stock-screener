name: Producer contract tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install deterministic test dependencies
        # Existing package imports need the data-layer modules too; no network
        # fetchers are called by this deterministic test selection.
        run: python -m pip install numpy pandas pytest yfinance sqlalchemy python-dotenv
      - name: Test producer contract without market requests or data writes
        run: python -m pytest tests/test_breakout_contract.py tests/test_scheduling.py -q
