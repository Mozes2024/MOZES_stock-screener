name: Daily Stock Screening Watchdog

on:
  schedule:
    # Delayed 13:20 Israel fallback for the 12:45 Cloudflare primary.
    - cron: '20 10 * * 1-5'
    - cron: '20 11 * * 1-5'

  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-daily-screening-ran:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check today's structured screening output
        id: check
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python scripts/screening_freshness_gate.py
          --event-name schedule
          --github-output "$GITHUB_OUTPUT"

      - name: Select the active Israel-offset fallback
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              print("active=true")
          else:
              offset = int(datetime.now(ZoneInfo("Asia/Jerusalem")).utcoffset().total_seconds() // 3600)
              expected = "20 10 * * 1-5" if offset == 3 else "20 11 * * 1-5"
              print(f"active={'true' if os.environ['EVENT_SCHEDULE'] == expected else 'false'}")
          PY

      - name: Check for an active daily screening run
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          RUN_COUNT=$(gh run list \
            --repo "$REPO" \
            --workflow daily_screening_git_storage.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')
          echo "run_count=$RUN_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $RUN_COUNT active Daily Stock Screening run(s)"

      - name: Trigger daily screening if missing
        if: steps.clock.outputs.active == 'true' && steps.check.outputs.should_run == 'true' && steps.active.outputs.run_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run daily_screening_git_storage.yml --repo "$REPO" --ref main
          echo "Triggered Daily Stock Screening fallback run"

      - name: No action needed
        if: steps.clock.outputs.active != 'true' || steps.check.outputs.should_run != 'true' || steps.active.outputs.run_count != '0'
        run: echo "Daily Stock Screening already produced valid output or is still active"
